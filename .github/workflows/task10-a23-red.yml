name: task10-final-gate

on:
  push:
    branches: ['task10/a23-green']
    paths:
      - '.github/workflows/task10-a23-red.yml'
      - 'apps/host/**'
      - 'apps/spatial/**'
      - 'packages/spatial-runtime/**'
      - 'tests/Workspace.Host.Tests/**'
      - 'tests/acceptance/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.425'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify generated contracts
        run: npm run vnext:contracts:check
      - name: Run vNext Node tests
        run: npm run vnext:test:node
      - name: Typecheck vNext
        run: npm run vnext:typecheck
      - name: Build vNext
        run: npm run vnext:build
      - name: Run vNext .NET tests
        run: npm run vnext:test:dotnet
      - name: Run Task10 acceptance
        run: npm run vnext:test:acceptance
