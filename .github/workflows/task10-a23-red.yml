name: task10-a23-green

on:
  push:
    branches: ['task10/a23-green']
    paths:
      - '.github/workflows/task10-a23-red.yml'
      - 'apps/host/**'
      - 'apps/spatial/**'
      - 'tests/Workspace.Host.Tests/**'

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.425'
      - name: Install repository dependencies
        run: npm install --ignore-scripts
      - name: Install Playwright test runner
        run: npm install --no-save --ignore-scripts @playwright/test@1.63.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build host
        run: dotnet build Workspace.VNext.sln --configuration Release
      - name: Run A23 acceptance
        run: npx playwright test tests/acceptance/m1-runtime.spec.ts -g "A23" --config tests/acceptance/playwright.config.ts
