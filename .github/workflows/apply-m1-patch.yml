name: apply-m1-patch

on:
  push:
    branches: ['m1/runtime-foundation']
    paths:
      - '.github/patches/pending.patch'
      - '.github/patches/pending.patch.gz'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply staged patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CraigCODA"
          git config user.email "mistercraigr@gmail.com"

          if [ -f .github/patches/pending.patch.gz ]; then
            gunzip -c .github/patches/pending.patch.gz | git apply --index -
            git rm .github/patches/pending.patch.gz
          else
            git apply --index .github/patches/pending.patch
            git rm .github/patches/pending.patch
          fi

          commit_message="chore(vnext): apply staged M1 changes"
          if [ -f .github/patches/commit-message.txt ]; then
            commit_message="$(cat .github/patches/commit-message.txt)"
            git rm .github/patches/commit-message.txt
          fi

          git commit -m "$commit_message"
          git push origin HEAD:m1/runtime-foundation
