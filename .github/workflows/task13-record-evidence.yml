name: task13-record-evidence

on:
  push:
    branches:
      - task13/execution
    paths:
      - .github/workflows/task13-record-evidence.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record observed Windows M1 evidence
        run: python .github/task13-record-evidence.py
      - name: Commit evidence record
        shell: bash
        run: |
          git config user.name 'CraigCODA'
          git config user.email 'mistercraigr@gmail.com'
          git add docs/architecture/vnext/m1-acceptance.md
          git commit -m 'docs(vnext): record observed M1 Windows acceptance' || exit 0
          git push origin HEAD:task13/execution
