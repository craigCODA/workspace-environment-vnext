name: windows-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-vnext-m1:
    name: verify-vnext-m1
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PLATFORM: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.425'
      - name: Verify Workspace Environment vNext M1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-vnext-m1.ps1
