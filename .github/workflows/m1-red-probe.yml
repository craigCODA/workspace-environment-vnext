name: m1-red-probe

on:
  push:
    branches:
      - m1/runtime-foundation

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Expected RED contract check
        run: node scripts/check-vnext-contracts.mjs
