name: export-local-test-runtime

on:
  push:
    branches:
      - tooling/local-test-runtime
    paths:
      - '.github/workflows/export-local-test-runtime.yml'

permissions:
  contents: read
  actions: read

jobs:
  export:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download already-successful offline runtime artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/runtime-source /tmp/runtime-parts
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/10282636480/zip > /tmp/runtime-source/artifact.zip
          unzip -q /tmp/runtime-source/artifact.zip -d /tmp/runtime-source/unpacked
          test -f /tmp/runtime-source/unpacked/workspace-local-test-runtime.tar.gz
          split -b 400000000 -d -a 2 /tmp/runtime-source/unpacked/workspace-local-test-runtime.tar.gz /tmp/runtime-parts/part-
          ls -lh /tmp/runtime-parts

      - name: Upload runtime part 00
        uses: actions/upload-artifact@v4
        with: { name: workspace-runtime-part-00, path: /tmp/runtime-parts/part-00, compression-level: 0, retention-days: 1, if-no-files-found: error }
      - name: Upload runtime part 01
        uses: actions/upload-artifact@v4
        with: { name: workspace-runtime-part-01, path: /tmp/runtime-parts/part-01, compression-level: 0, retention-days: 1, if-no-files-found: error }
      - name: Upload runtime part 02
        uses: actions/upload-artifact@v4
        with: { name: workspace-runtime-part-02, path: /tmp/runtime-parts/part-02, compression-level: 0, retention-days: 1, if-no-files-found: error }
      - name: Upload runtime part 03
        uses: actions/upload-artifact@v4
        with: { name: workspace-runtime-part-03, path: /tmp/runtime-parts/part-03, compression-level: 0, retention-days: 1, if-no-files-found: error }
      - name: Upload runtime part 04
        uses: actions/upload-artifact@v4
        with: { name: workspace-runtime-part-04, path: /tmp/runtime-parts/part-04, compression-level: 0, retention-days: 1, if-no-files-found: error }
      - name: Upload runtime part 05
        uses: actions/upload-artifact@v4
        with: { name: workspace-runtime-part-05, path: /tmp/runtime-parts/part-05, compression-level: 0, retention-days: 1, if-no-files-found: error }
      - name: Upload runtime part 06
        uses: actions/upload-artifact@v4
        with: { name: workspace-runtime-part-06, path: /tmp/runtime-parts/part-06, compression-level: 0, retention-days: 1, if-no-files-found: error }
