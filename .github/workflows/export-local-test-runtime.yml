name: export-local-test-runtime

on:
  push:
    branches:
      - tooling/local-test-runtime
    paths:
      - '.github/workflows/export-local-test-runtime.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'

      - name: Install Playwright Chromium 1.63.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw
          cd /tmp/pw
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund @playwright/test@1.63.0
          npx playwright install chromium
          tar -C "$HOME/.cache" -czf /tmp/playwright-chromium-1.63.tar.gz ms-playwright

      - name: Upload pinned Chromium
        uses: actions/upload-artifact@v4
        with:
          name: workspace-local-playwright-chromium-1-63
          path: /tmp/playwright-chromium-1.63.tar.gz
          compression-level: 0
          retention-days: 1
