name: export-local-test-runtime

on:
  push:
    branches:
      - tooling/local-test-runtime
    paths:
      - '.github/workflows/export-local-test-runtime.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'

      - name: Populate exact Playwright npm cache
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          set -euo pipefail
          npm cache add @playwright/test@1.63.0
          npm cache add playwright@1.63.0
          npm cache add playwright-core@1.63.0
          tar -C "$HOME" -czf /tmp/playwright-npm-cache.tar.gz .npm

      - name: Upload Playwright npm cache
        uses: actions/upload-artifact@v4
        with:
          name: workspace-local-playwright-npm-cache
          path: /tmp/playwright-npm-cache.tar.gz
          compression-level: 0
          retention-days: 1
