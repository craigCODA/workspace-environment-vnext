name: export-local-test-runtime

on:
  push:
    branches:
      - tooling/local-test-runtime
    paths:
      - '.github/workflows/export-local-test-runtime.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout M1 branch
        uses: actions/checkout@v4
        with:
          ref: m1/runtime-foundation

      - name: Use .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.425'

      - name: Restore NuGet dependency tree
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore Workspace.VNext.sln

      - name: Pack compact .NET 8 SDK/runtime
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${DOTNET_ROOT:-/usr/share/dotnet}"
          OUT=/tmp/dotnet8
          mkdir -p "$OUT/host/fxr" "$OUT/sdk" "$OUT/shared/Microsoft.NETCore.App" "$OUT/shared/Microsoft.AspNetCore.App" "$OUT/packs"
          cp "$ROOT/dotnet" "$OUT/dotnet"
          cp -a "$ROOT/host/fxr"/8.* "$OUT/host/fxr/"
          cp -a "$ROOT/sdk/8.0.425" "$OUT/sdk/"
          cp -a "$ROOT/shared/Microsoft.NETCore.App"/8.* "$OUT/shared/Microsoft.NETCore.App/"
          cp -a "$ROOT/shared/Microsoft.AspNetCore.App"/8.* "$OUT/shared/Microsoft.AspNetCore.App/"
          for pack in Microsoft.NETCore.App.Host.linux-x64 Microsoft.NETCore.App.Ref Microsoft.AspNetCore.App.Ref NETStandard.Library.Ref; do
            if [ -d "$ROOT/packs/$pack" ]; then
              mkdir -p "$OUT/packs/$pack"
              find "$ROOT/packs/$pack" -mindepth 1 -maxdepth 1 -type d \( -name '8.*' -o -name '2.*' \) -exec cp -a {} "$OUT/packs/$pack/" \;
            fi
          done
          if [ -d "$ROOT/sdk-manifests/8.0.100" ]; then
            mkdir -p "$OUT/sdk-manifests"
            cp -a "$ROOT/sdk-manifests/8.0.100" "$OUT/sdk-manifests/"
          fi
          "$OUT/dotnet" --info
          tar -C /tmp -cf /tmp/dotnet8.tar dotnet8

      - name: Upload compact .NET 8 runtime
        uses: actions/upload-artifact@v4
        with:
          name: workspace-local-dotnet8-compact
          path: /tmp/dotnet8.tar
          compression-level: 0
          retention-days: 1
