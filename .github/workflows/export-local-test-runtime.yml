name: export-local-test-runtime

on:
  push:
    branches:
      - tooling/local-test-runtime
    paths:
      - '.github/workflows/export-local-test-runtime.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout M1 branch
        uses: actions/checkout@v4
        with:
          ref: m1/runtime-foundation

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'

      - name: Use .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.425'

      - name: Restore exact dependency trees
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          dotnet restore Workspace.VNext.sln

      - name: Pack offline runtime components without compression
        shell: bash
        run: |
          set -euo pipefail
          NODE_BIN="$(readlink -f "$(command -v node)")"
          NODE_ROOT="$(dirname "$(dirname "$NODE_BIN")")"
          DOTNET_ROOT_PATH="${DOTNET_ROOT:-/usr/share/dotnet}"
          mkdir -p /tmp/workspace-local-runtime
          tar -C "$NODE_ROOT" -cf /tmp/workspace-local-runtime/node.tar .
          tar -C "$DOTNET_ROOT_PATH" -cf /tmp/workspace-local-runtime/dotnet.tar .
          tar -C "$HOME/.nuget/packages" -cf /tmp/workspace-local-runtime/nuget.tar .
          tar -cf /tmp/workspace-local-runtime/node_modules.tar node_modules
          cp package-lock.json /tmp/workspace-local-runtime/package-lock.json
          printf '%s\n' "$(node --version)" > /tmp/workspace-local-runtime/NODE_VERSION
          printf '%s\n' "$(dotnet --version)" > /tmp/workspace-local-runtime/DOTNET_VERSION

      - name: Upload Node runtime
        uses: actions/upload-artifact@v4
        with:
          name: workspace-local-node24
          path: /tmp/workspace-local-runtime/node.tar
          compression-level: 0
          retention-days: 1

      - name: Upload .NET runtime
        uses: actions/upload-artifact@v4
        with:
          name: workspace-local-dotnet8
          path: /tmp/workspace-local-runtime/dotnet.tar
          compression-level: 0
          retention-days: 1

      - name: Upload NuGet cache
        uses: actions/upload-artifact@v4
        with:
          name: workspace-local-nuget
          path: /tmp/workspace-local-runtime/nuget.tar
          compression-level: 0
          retention-days: 1

      - name: Upload Node dependencies and lock
        uses: actions/upload-artifact@v4
        with:
          name: workspace-local-node-modules
          path: |
            /tmp/workspace-local-runtime/node_modules.tar
            /tmp/workspace-local-runtime/package-lock.json
            /tmp/workspace-local-runtime/NODE_VERSION
            /tmp/workspace-local-runtime/DOTNET_VERSION
          compression-level: 0
          retention-days: 1
