name: export-local-test-runtime

on:
  push:
    branches:
      - tooling/local-test-runtime
    paths:
      - '.github/workflows/export-local-test-runtime.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'

      - name: Fetch Playwright Test 1.63.0 without browsers
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw
          cd /tmp/pw
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund @playwright/test@1.63.0
          tar -czf /tmp/playwright-node-modules.tar.gz node_modules package-lock.json package.json

      - name: Upload Playwright dependency bundle
        uses: actions/upload-artifact@v4
        with:
          name: workspace-local-playwright-1-63
          path: /tmp/playwright-node-modules.tar.gz
          compression-level: 0
          retention-days: 1
