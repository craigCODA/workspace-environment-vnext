name: export-local-test-runtime

on:
  push:
    branches:
      - tooling/local-test-runtime
    paths:
      - '.github/workflows/export-local-test-runtime.yml'

permissions:
  contents: read
  actions: read

jobs:
  export:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download compact .NET runtime artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/source /tmp/parts
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/10283593968/zip > /tmp/source/artifact.zip
          unzip -q /tmp/source/artifact.zip -d /tmp/source/unpacked
          test -f /tmp/source/unpacked/dotnet8.tar
          split -b 400000000 -d -a 2 /tmp/source/unpacked/dotnet8.tar /tmp/parts/part-
          test -f /tmp/parts/part-00
          test -f /tmp/parts/part-01
          test -f /tmp/parts/part-02
          ls -lh /tmp/parts

      - name: Upload .NET part 00
        uses: actions/upload-artifact@v4
        with: { name: workspace-dotnet8-part-00, path: /tmp/parts/part-00, compression-level: 0, retention-days: 1, if-no-files-found: error }
      - name: Upload .NET part 01
        uses: actions/upload-artifact@v4
        with: { name: workspace-dotnet8-part-01, path: /tmp/parts/part-01, compression-level: 0, retention-days: 1, if-no-files-found: error }
      - name: Upload .NET part 02
        uses: actions/upload-artifact@v4
        with: { name: workspace-dotnet8-part-02, path: /tmp/parts/part-02, compression-level: 0, retention-days: 1, if-no-files-found: error }
