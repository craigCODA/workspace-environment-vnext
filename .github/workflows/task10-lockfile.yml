name: task10-lockfile

on:
  push:
    branches: ['task10/a23-green']
    paths:
      - '.github/workflows/task10-lockfile.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - name: Generate lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          git diff --check
          git diff -- package-lock.json
      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already current'
            exit 0
          fi
          git config user.name 'CraigCODA'
          git config user.email 'mistercraigr@gmail.com'
          git add package-lock.json
          git commit -m 'build(vnext): pin Playwright acceptance dependencies'
          git push origin HEAD:task10/a23-green
