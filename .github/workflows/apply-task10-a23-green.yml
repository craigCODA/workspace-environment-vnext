name: apply-task10-diagnostics

on:
  push:
    branches: ['task10/a52-red']
    paths:
      - '.github/patches/task10-diagnostics.patch.gz'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Task 10 diagnostic patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CraigCODA"
          git config user.email "mistercraigr@gmail.com"
          gunzip -c .github/patches/task10-diagnostics.patch.gz | git apply --index -
          git rm .github/patches/task10-diagnostics.patch.gz
          git commit -m "test(vnext): expose read-only Task 10 diagnostics"
          git push origin HEAD:task10/a52-red
