name: export-playwright-1-63

on:
  push:
    branches: ['tooling/playwright-1.63']
    paths:
      - '.github/workflows/export-playwright-1.63.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - name: Pack Playwright packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/playwright-packs
          cd /tmp/playwright-packs
          npm pack @playwright/test@1.63.0
          npm pack playwright@1.63.0
          npm pack playwright-core@1.63.0
          ls -lh
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-1.63-npm-packs
          path: /tmp/playwright-packs/*.tgz
          compression-level: 0
          retention-days: 1
