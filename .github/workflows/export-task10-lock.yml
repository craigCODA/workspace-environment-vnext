name: export-task10-lock

on:
  push:
    branches: ['task10/a52-red']
    paths:
      - '.github/workflows/export-task10-lock.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: task10-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
