name: m2a-checkpoint
on:
  push:
    branches: ['m2/spatial-workspace-shell']
    paths: ['.github/m2a-stage/ready.json']
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.apply.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: apply
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, hashlib, json, pathlib
          root = pathlib.Path('.github/m2a-stage')
          manifest = json.loads((root/'ready.json').read_text())
          parts = []
          for name in manifest['parts']:
              text = (root/name).read_text().strip()
              for old, new in manifest.get('transportCorrections', {}).get(name, []):
                  text = text.replace(old, new)
              parts.append(text)
          patch = gzip.decompress(base64.b64decode(''.join(parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == manifest['sha256'], 'Patch integrity mismatch'
          pathlib.Path('/tmp/m2a.patch').write_bytes(patch)
          PY
          git apply --check /tmp/m2a.patch
          git apply --index /tmp/m2a.patch
          git rm -r .github/m2a-stage
          git config user.name 'Craig Ramos'
          git config user.email 'mistercraigr@gmail.com'
          git commit -m 'feat(m2a): add full-viewport room and persistent object controls'
          git push origin HEAD:m2/spatial-workspace-shell
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  windows:
    needs: apply
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PLATFORM: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.revision }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.425'
      - name: Compile real Windows host and adapters
        run: dotnet build apps/host-windows-vnext/Workspace.Host.Windows.csproj --configuration Release
      - name: Existing M1 and new M2A host regressions
        run: dotnet test Workspace.VNext.sln --configuration Release
  room:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLATFORM: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.425'
      - name: Locked dependencies and Chromium
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Contracts, unit tests, types and both spatial entries
        run: |
          npm run vnext:contracts:check
          npm run vnext:test:node
          npm run vnext:typecheck
          npm run vnext:build
          dotnet test Workspace.VNext.sln --configuration Release --no-build
      - name: M1 and M2A room browser regressions
        run: |
          xvfb-run -a node node_modules/@playwright/test/cli.js test --config tests/acceptance/playwright.config.ts --reporter=line
          xvfb-run -a node node_modules/@playwright/test/cli.js test --config tests/acceptance/playwright.m2a.config.ts --reporter=line
      - name: Export room checkpoint source
        run: |
          mkdir -p /tmp/m2a-room-checkpoint
          git archive --format=zip --prefix=workspace-environment-m2a-room-checkpoint/ --output=/tmp/m2a-room-checkpoint/m2a-room-source.zip HEAD
          git rev-parse HEAD > /tmp/m2a-room-checkpoint/COMMIT.txt
          sha256sum /tmp/m2a-room-checkpoint/m2a-room-source.zip > /tmp/m2a-room-checkpoint/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: m2a-room-checkpoint-source
          path: /tmp/m2a-room-checkpoint/
          retention-days: 14
